name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17 (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          pip install -r backend/requirements.txt
          pip install -r producer/requirements.txt
          pip install -r streaming/requirements.txt
          pip install -r tests/requirements.txt

      - name: Lint – critical errors
        run: |
          flake8 backend/ producer/ streaming/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint – style warnings (non-blocking)
        run: |
          flake8 backend/ producer/ streaming/ \
            --count --max-line-length=120 --statistics --exit-zero

      - name: Run unit tests
        env:
          ENABLE_KAFKA: "false"
          DATABASE_URL: "sqlite:///test_fraud.db"
        run: |
          pytest tests/ -v --tb=short
